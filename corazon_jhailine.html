<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jhailine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0510;
    background: radial-gradient(ellipse at center, #12081e 0%, #0a0510 65%, #050208 100%);
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #heart-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
  }

  .name {
    font-family: 'Great Vibes', 'Snell Roundhand', 'Brush Script MT', 'Segoe Script', cursive;
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    color: #fdf9ff;
    text-shadow:
      0 0 10px rgba(255,255,255,0.85),
      0 0 24px rgba(232,121,249,0.85),
      0 0 46px rgba(168,85,247,0.7),
      0 0 80px rgba(124,58,237,0.55);
    letter-spacing: 2px;
    opacity: 0;
    transform: translateY(10px) scale(0.92);
    filter: blur(4px);
    animation: nameHeartbeat 0.85s ease-in-out 0.6s infinite;
    margin-top: 6vh;
    user-select: none;
  }

  .name.show {
    animation:
      nameReveal 0.7s cubic-bezier(.19,1,.22,1) forwards,
      nameHeartbeat 0.85s ease-in-out 0.6s infinite;
  }

  @keyframes nameReveal {
    0%   { opacity: 0; transform: translateY(10px) scale(0.92); filter: blur(4px); }
    60%  { opacity: 1; transform: translateY(0) scale(1.04); filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  @keyframes nameHeartbeat {
    0%, 100% { transform: scale(1); }
    10%      { transform: scale(1.055); }
    20%      { transform: scale(1); }
    30%      { transform: scale(1.03); }
    45%      { transform: scale(1); }
  }

  .anniversary {
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    font-weight: 400;
    font-size: clamp(1.05rem, 3.4vw, 1.6rem);
    color: #f5e6ff;
    text-shadow: 0 0 14px rgba(232,121,249,0.75), 0 0 34px rgba(168,85,247,0.5);
    letter-spacing: 1px;
    text-align: center;
    margin-top: 28vh;
    opacity: 0;
    transform: translateY(12px);
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    transition: text-shadow 0.25s ease;
  }

  .anniversary.active {
    text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 40px rgba(232,121,249,0.95), 0 0 70px rgba(168,85,247,0.8);
  }

  .anniversary.show {
    animation: msgReveal 0.7s cubic-bezier(.19,1,.22,1) forwards;
  }

  .message {
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    font-weight: 300;
    font-size: clamp(0.95rem, 2.6vw, 1.3rem);
    color: #e9d5ff;
    text-shadow: 0 0 12px rgba(168,85,247,0.65), 0 0 30px rgba(124,58,237,0.35);
    text-align: center;
    max-width: 86vw;
    line-height: 1.6;
    margin-top: 2.2vh;
    opacity: 0;
    transform: translateY(14px);
    letter-spacing: 0.3px;
  }

  .message.show {
    animation: msgReveal 0.75s cubic-bezier(.19,1,.22,1) forwards;
  }

  @keyframes msgReveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .hint {
    position: fixed;
    bottom: 4vh;
    left: 0;
    width: 100%;
    text-align: center;
    color: rgba(232, 213, 255, 0.35);
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0;
    z-index: 5;
    pointer-events: none;
  }

  .hint.show {
    animation: msgReveal 0.8s ease forwards;
  }
</style>
</head>
<body>

<canvas id="heart-canvas"></canvas>

<div class="overlay">
  <h1 class="name" id="nameText">Jhailine</h1>
  <p class="anniversary" id="anniversaryText">Feliz 7mo Aniversario 💜</p>
  <p class="message" id="messageText">7 meses latiendo juntos, y mi corazón sigue aprendiendo a querer distinto desde que llegaste a mi vida, Jhailine. Feliz aniversario a ti y a mí.</p>
</div>

<div class="hint" id="hintText">toca o mueve el cursor</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('heart-canvas');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  var W = 0, H = 0, centerX = 0, centerY = 0, scalePx = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    centerX = W / 2;
    centerY = H * 0.42;
    scalePx = Math.min(W, H) * 0.30;
  }

  // ---------- Palette ----------
  var PALETTE_EDGE = ['#e879f9', '#c084fc', '#f5f3ff'];
  var PALETTE_FILL = ['#a855f7', '#7c3aed', '#c084fc', '#9333ea'];

  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  // ---------- Heart geometry ----------
  // Parametric heart curve (math space, y-up)
  function heartCurvePoint(t) {
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x, y: y };
  }

  var EDGE_COUNT = 190;
  var FILL_COUNT = 380;

  var edgeMath = [];
  for (var i = 0; i < EDGE_COUNT; i++) {
    edgeMath.push(heartCurvePoint((i / EDGE_COUNT) * Math.PI * 2));
  }

  // bounding box of the curve
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  edgeMath.forEach(function (p) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  });
  var bboxCx = (minX + maxX) / 2;
  var bboxCy = (minY + maxY) / 2;
  var halfExtent = Math.max(maxX - minX, maxY - minY) / 2;

  function pointInPolygon(x, y, poly) {
    var inside = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var xi = poly[i].x, yi = poly[i].y;
      var xj = poly[j].x, yj = poly[j].y;
      var intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  var fillMath = [];
  var attempts = 0;
  while (fillMath.length < FILL_COUNT && attempts < FILL_COUNT * 40) {
    attempts++;
    var rx = minX + Math.random() * (maxX - minX);
    var ry = minY + Math.random() * (maxY - minY);
    if (pointInPolygon(rx, ry, edgeMath)) {
      fillMath.push({ x: rx, y: ry });
    }
  }

  function toUnit(p) {
    return {
      ux: (p.x - bboxCx) / halfExtent,
      uy: -(p.y - bboxCy) / halfExtent // flip for canvas y-down
    };
  }

  // ---------- Particles ----------
  function makeParticle(mathPoint, isEdge) {
    var u = toUnit(mathPoint);
    var angle = Math.random() * Math.PI * 2;
    var dist = scalePx * (2.2 + Math.random() * 2.6);
    return {
      ux: u.ux,
      uy: u.uy,
      isEdge: isEdge,
      size: isEdge ? (1.6 + Math.random() * 1.6) : (1.1 + Math.random() * 1.7),
      color: isEdge ? pick(PALETTE_EDGE) : pick(PALETTE_FILL),
      phase: Math.random() * Math.PI * 2,
      freq: 0.6 + Math.random() * 0.9,
      noiseAmp: 2 + Math.random() * 3,
      delay: Math.random() * 180,
      originX: Math.cos(angle) * dist,
      originY: Math.sin(angle) * dist,
      x: 0, y: 0,
      glow: 0
    };
  }

  var particles = [];
  edgeMath.forEach(function (p) { particles.push(makeParticle(p, true)); });
  fillMath.forEach(function (p) { particles.push(makeParticle(p, false)); });

  // ---------- Pointer interaction ----------
  var pointer = { x: -9999, y: -9999, active: false };

  function setPointerFromEvent(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    pointer.x = clientX - rect.left;
    pointer.y = clientY - rect.top;
    pointer.active = true;
  }

  window.addEventListener('pointermove', function (e) {
    setPointerFromEvent(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('pointerdown', function (e) {
    setPointerFromEvent(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('pointerup', function () {
    pointer.active = false;
  }, { passive: true });

  window.addEventListener('pointerleave', function () {
    pointer.active = false;
  }, { passive: true });

  window.addEventListener('touchend', function () {
    pointer.active = false;
  }, { passive: true });

  // ---------- Heartbeat (lub-dub) ----------
  function heartbeatScale(tms) {
    var period = 820; // ~73 bpm, natural resting heart rate
    var tt = (tms % period) / period;
    function bump(center, width, height) {
      var d = tt - center;
      return height * Math.exp(-(d * d) / (2 * width * width));
    }
    var pulse = bump(0.05, 0.04, 1) + bump(0.17, 0.05, 0.55);
    return 1 + pulse * 0.06;
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // ---------- Animation loop ----------
  var startTime = null;
  var FORMATION_DURATION = 650; // ms, per-particle travel time
  var formationDone = false;

  var nameEl = document.getElementById('nameText');
  var anniversaryEl = document.getElementById('anniversaryText');
  var messageEl = document.getElementById('messageText');
  var hintEl = document.getElementById('hintText');

  function revealText() {
    if (formationDone) return;
    formationDone = true;
    nameEl.classList.add('show');
    setTimeout(function () { anniversaryEl.classList.add('show'); }, 250);
    setTimeout(function () { messageEl.classList.add('show'); }, 550);
    setTimeout(function () { hintEl.classList.add('show'); }, 900);
  }

  // ---------- Strong reactive pulse (triggered by the anniversary text) ----------
  var strongPulseStart = null; // elapsed-time (ms since startTime) when last triggered

  function triggerStrongPulse() {
    if (!startTime) return;
    var elapsedNow = performance.now() - startTime;
    if (strongPulseStart !== null && elapsedNow - strongPulseStart < 250) return; // cooldown
    strongPulseStart = elapsedNow;
    anniversaryEl.classList.add('active');
    setTimeout(function () { anniversaryEl.classList.remove('active'); }, 350);
  }

  anniversaryEl.addEventListener('pointerenter', triggerStrongPulse);
  anniversaryEl.addEventListener('pointerdown', triggerStrongPulse);

  function strongPulseBoost(elapsed) {
    if (strongPulseStart === null) return 0;
    var dur = 420;
    var dt = elapsed - strongPulseStart;
    if (dt < 0 || dt > dur) return 0;
    return Math.sin((dt / dur) * Math.PI) * 0.16;
  }

  function drawBackgroundGlow(pulse) {
    var r = scalePx * 1.9 * pulse;
    var grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, r);
    grad.addColorStop(0, 'rgba(124, 58, 237, 0.16)');
    grad.addColorStop(0.5, 'rgba(88, 28, 135, 0.08)');
    grad.addColorStop(1, 'rgba(10, 5, 16, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function frame(now) {
    if (!startTime) startTime = now;
    var elapsed = now - startTime;

    var beat = heartbeatScale(elapsed) + strongPulseBoost(elapsed);

    ctx.clearRect(0, 0, W, H);
    drawBackgroundGlow(beat);

    var allSettled = true;

    ctx.globalCompositeOperation = 'lighter';

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      var localT = (elapsed - p.delay) / FORMATION_DURATION;
      var progress = localT <= 0 ? 0 : (localT >= 1 ? 1 : easeOutCubic(localT));
      if (progress < 1) allSettled = false;

      // organic float, ramps in as particle settles
      var noiseX = Math.sin(elapsed * 0.001 * p.freq + p.phase) * p.noiseAmp * progress;
      var noiseY = Math.cos(elapsed * 0.0013 * p.freq + p.phase * 1.3) * p.noiseAmp * progress;

      var targetX = centerX + p.ux * scalePx * beat + noiseX;
      var targetY = centerY + p.uy * scalePx * beat + noiseY;

      var curX = p.originX + centerX;
      var curY = p.originY + centerY;
      var x = curX + (targetX - curX) * progress;
      var y = curY + (targetY - curY) * progress;

      // pointer repulsion
      var glowBoost = 0;
      if (pointer.active) {
        var dx = x - pointer.x;
        var dy = y - pointer.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var radius = 110;
        if (dist < radius) {
          var force = (1 - dist / radius);
          var ang = Math.atan2(dy, dx);
          x += Math.cos(ang) * force * 26;
          y += Math.sin(ang) * force * 26;
          glowBoost = force;
        }
      }

      p.x = x;
      p.y = y;

      var alpha = 0.35 + 0.65 * progress;
      var size = p.size * (1 + glowBoost * 0.9) * (p.isEdge ? 1 : 0.95);

      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = (p.isEdge ? 10 : 7) + glowBoost * 14;
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (allSettled) revealText();

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
